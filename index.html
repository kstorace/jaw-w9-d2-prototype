<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>JAW – Senior Strategic Procurement Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#overview" data-route="overview" aria-label="JAW overview">
        <span class="brand-mark" aria-hidden="true">J</span>
        <span><strong>JAW</strong><small>Job Application Assistant</small></span>
      </a>
      <div class="topbar-context">
        <span class="eyebrow">Application</span>
        <strong>Senior Strategic Procurement Manager</strong>
        <span>Tavera Anlagenbau GmbH</span>
      </div>
      <button class="quiet-button prototype-reset" type="button">Reset demo</button>
    </header>

    <aside class="sidebar" aria-label="Workspaces">
      <div class="application-mini">
        <span class="company-icon" aria-hidden="true">TA</span>
        <div><strong>Senior Strategic Procurement Manager</strong><small>Tavera Anlagenbau GmbH</small></div>
      </div>
      <nav>
        <button type="button" data-route="overview"><span aria-hidden="true">⌂</span>Overview</button>
        <button type="button" data-route="vacancy"><span aria-hidden="true">▤</span>Vacancy</button>
        <button type="button" data-route="alignment"><span aria-hidden="true">◎</span>Alignment <span class="nav-dot" aria-label="Attention required"></span></button>
        <button type="button" data-route="documents"><span aria-hidden="true">▱</span>Documents</button>
        <button type="button" data-route="history"><span aria-hidden="true">◷</span>Status &amp; history</button>
      </nav>
      <div class="sidebar-note">
        <strong>Your control</strong>
        <p>JAW prepares. You review, decide and approve.</p>
      </div>
    </aside>

    <main id="main" tabindex="-1">
      <div id="view" aria-live="polite"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="app.js"></script>
</body>
</html>
